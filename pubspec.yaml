name: borneogis_pdf_map
description: BorneoGIS PDF Map - Elite Edition by Lamri. Professional Offline GeoPDF Viewer for Android.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # PDF rendering
  pdfx: ^2.6.0

  # GPS & Location
  geolocator: ^12.0.0
  compass: ^1.0.0
  sensors_plus: ^6.0.0

  # File picking
  file_picker: ^8.1.2

  # Path management
  path_provider: ^2.1.4
  path: ^1.9.0

  # State management
  provider: ^6.1.2
  shared_preferences: ^2.3.3

  # Permissions
  permission_handler: ^11.3.1

  # UTM conversion
  latlong2: ^0.9.1

  # UI
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.1

  # Keep screen on
  wakelock_plus: ^1.2.8

  # Native file open / storage access framework
  open_file: ^3.5.8

  # Cupertino icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
